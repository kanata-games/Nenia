<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>ネーニア年代記</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yusei+Magic&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: a life-ribbon header that is always visible, then activities and a tabbed side book (shop / rebirth / chronicle / past lives); stacks to one column on phones. */
:root{
  --bg:#e9eee8; --surface:#f8faf5; --sunk:#dfe6de; --ink:#22302a; --muted:#64736b;
  --accent:#c5861a; --accent-soft:#f3e2bf; --teal:#3b6a60; --teal-soft:#d4e5df; --line:#c9d3ca; --danger:#b4533c;
  --stage:#5f8a3a;
  --display:"Yusei Magic","Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131917; --surface:#1c2421; --sunk:#252f2b; --ink:#e6ece5; --muted:#93a198;
  --accent:#e6ae48; --accent-soft:#3d3220; --teal:#83b6a8; --teal-soft:#21342f; --line:#33403b; --danger:#e08a73; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131917; --surface:#1c2421; --sunk:#252f2b; --ink:#e6ece5; --muted:#93a198;
  --accent:#e6ae48; --accent-soft:#3d3220; --teal:#83b6a8; --teal-soft:#21342f; --line:#33403b; --danger:#e08a73; color-scheme:dark}

body{background:var(--bg);background:color-mix(in srgb,var(--bg) 90%,var(--stage));transition:background .8s;color:var(--ink);font-family:var(--body);font-weight:500;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--stage);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.toprow{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px}
h1{font-family:var(--display);font-weight:400;font-size:1.7rem;margin:0;line-height:1.2;text-wrap:balance}
h1 small{font-family:var(--body);font-size:.8rem;color:var(--muted);margin-left:8px;letter-spacing:.05em}
.purse{display:flex;gap:16px;flex-wrap:wrap}
.purse div{display:flex;flex-direction:column;align-items:flex-end}
.purse b{font-size:1.25rem}
.purse span{font-size:.72rem;color:var(--muted);letter-spacing:.08em}
.gold b{color:var(--accent)} .star b{color:var(--teal)} .drop b{color:#6a5fc4}

.stage{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.chip{font-family:var(--display);background:var(--stage);color:#fff;border-radius:999px;padding:2px 16px;font-size:1.05rem;transition:background .8s}
.sgauge{flex:1 1 160px;min-width:0;height:9px;border-radius:5px;background:var(--sunk);overflow:hidden}
.sgauge i{display:block;height:100%;width:0;background:var(--stage);transition:width .5s}
.snext{font-size:.8rem;color:var(--muted);flex-basis:100%}
.card .arrive{font-family:var(--display);font-size:1.4rem;color:var(--stage);margin:0}
.ribbon{position:relative;height:38px}
.ribbon .track{position:absolute;left:0;right:0;top:12px;height:12px;border-radius:6px;background:var(--sunk);overflow:hidden}
.ribbon .fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--accent));width:0}
.ribbon .tick{position:absolute;top:26px;font-size:.66rem;color:var(--muted);transform:translateX(-50%)}
.ribbon .tick::before{content:"";position:absolute;left:50%;top:-14px;width:1px;height:12px;background:var(--line)}
.ribbon .me{position:absolute;top:0;font-size:.72rem;transform:translateX(-50%);color:var(--ink);white-space:nowrap;font-weight:700}
.agebar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 14px;font-size:.88rem;color:var(--muted)}
.agebar b{color:var(--ink);font-size:1.05rem}
.toggles{display:flex;gap:8px;flex-wrap:wrap}
.tg{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 12px;font-size:.8rem}
.tg[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--surface)}

/* main */
.main{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.main{grid-template-columns:minmax(0,1fr)}}
.sect-h{font-family:var(--display);font-weight:400;font-size:1.15rem;margin:0 0 8px 4px}
.acts{display:flex;flex-direction:column;gap:8px}
.act{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:4px 12px;align-items:center;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;transition:border-color .2s,transform .1s}
.act:hover:not(:disabled){border-color:var(--teal)}
.act:active:not(:disabled){transform:scale(.99)}
.act.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.act:disabled{cursor:default;opacity:.62}
.seal{grid-row:span 2;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
  font-family:var(--display);font-size:1.4rem;background:var(--teal-soft);color:var(--teal)}
.act.on .seal{background:var(--accent);color:var(--surface)}
.act .nm{font-weight:700;display:flex;gap:8px;align-items:baseline;min-width:0}
.act .nm em{font-style:normal;font-size:.75rem;color:var(--muted);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act .lv{font-size:.9rem;color:var(--muted);text-align:right}
.act .lv b{color:var(--ink);font-size:1.05rem}
.bar{grid-column:2 / 4;height:7px;border-radius:4px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--teal)}
.act.on .bar i{background:var(--accent)}
.lock{grid-column:2 / 4;font-size:.75rem;color:var(--muted)}

.book{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{flex:1;border:0;background:none;padding:10px 6px;font-size:.88rem;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.pane{padding:12px;display:flex;flex-direction:column;gap:8px;max-height:560px;overflow-y:auto}
.note{font-size:.8rem;color:var(--muted);margin:0 2px 4px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--bg)}
.item .t{font-weight:700}
.item .d{font-size:.78rem;color:var(--muted);grid-column:1}
.item button{grid-row:1 / 3;grid-column:2;border:1px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:6px 10px;font-size:.82rem;min-width:84px}
.item button:disabled{border-color:var(--line);background:none;color:var(--muted);cursor:default}
.item.owned{opacity:.55}
.item.star-up button{border-color:var(--teal);background:var(--teal-soft)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.log li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;font-size:.86rem}
.log li span{color:var(--muted);text-align:right}
.log li.big{color:var(--accent);font-weight:700}
.past{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;font-size:.84rem;padding:8px 10px;border-radius:12px;background:var(--bg)}
.past b{font-family:var(--display);font-weight:400}

/* death */
.veil{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:5;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px;text-align:center}
.card h2{font-family:var(--display);font-weight:400;font-size:1.6rem;margin:0}
.card p{margin:0;color:var(--muted)}
.card .gain{font-size:1.1rem;color:var(--teal)}
.big-btn{border:0;border-radius:14px;padding:12px;background:var(--accent);color:var(--surface);font-weight:700;font-size:1rem}
.savebox{display:flex;flex-direction:column;gap:8px}
.savebox textarea{font:inherit;font-size:.75rem;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;width:100%;box-sizing:border-box;resize:vertical;word-break:break-all}
.savebox .row{display:flex;gap:8px;flex-wrap:wrap}
.tg.danger{color:var(--danger);border-color:var(--danger)}
/* scene */
.scene{position:relative;height:210px;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#cfe8f3}
.scene svg{display:block;width:100%;height:100%}
.bubble{position:absolute;left:calc(50% + 56px);top:18px;background:var(--surface);color:var(--ink);border:1px solid var(--line);
  padding:4px 12px;border-radius:14px;font-size:.78rem;max-width:min(40%,260px);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.bubble::after{content:"";position:absolute;left:-6px;bottom:8px;width:10px;height:10px;background:var(--surface);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
#hero{transition:opacity .9s}
#hero.gone{opacity:.2}
#hero .shadow{fill:rgba(20,20,50,.18)}
#hero .glow{fill:url(#glowG);opacity:0;transition:opacity .8s}
#hero.pose-cast .glow,#hero.pose-pray .glow{opacity:1}
#hero .tilt{transform-origin:0 0}
#hero .prop,#hero .fx,#hero .crown,#hero .tufts{display:none}
#hero.prop-hoe .p-hoe,#hero.prop-sword .p-sword,#hero.prop-book .p-book,#hero.prop-bag .p-bag,
#hero.prop-rod .p-rod,#hero.prop-lute .p-lute,#hero.prop-scope .p-scope,#hero.crowned .crown,#hero.pose-walk .tufts,
#hero.fx-sprout .f-sprout,#hero.fx-spark .f-spark,#hero.fx-note .f-note,#hero.fx-ripple .f-ripple,#hero.fx-leaf .f-leaf{display:inline}
#hero .swingP{transform-origin:30px -58px;animation:tool .9s ease-in-out infinite alternate}
#hero .floaty{animation:bob 1.8s ease-in-out infinite alternate}
#hero.pose-work .bodyBob{animation:hop .45s ease-in-out infinite alternate}
#hero.pose-work .tilt{animation:tiltS .9s ease-in-out infinite alternate}
#hero.pose-walk .bodyBob{animation:hop .3s ease-in-out infinite alternate}
#hero.pose-walk .tilt{animation:tiltS .6s ease-in-out infinite alternate}
#hero.pose-sit .tilt{animation:tiltS 3.2s ease-in-out infinite alternate}
#hero.pose-cast .bodyBob{animation:floatB 1.6s ease-in-out infinite alternate}
#hero.pose-pray .bodyBob{animation:floatB 2.6s ease-in-out infinite alternate}
#hero.pose-strum .tilt{animation:tiltS .45s ease-in-out infinite alternate}
#hero.pose-wave .tilt{animation:tiltL .8s ease-in-out infinite alternate}
#hero.pose-wave .bodyBob{animation:hop .8s ease-in-out infinite alternate}
#hero .tufts g{animation:slide 1.2s linear infinite}
#hero .tufts path{stroke:rgba(40,70,30,.45);stroke-width:2;fill:none;stroke-linecap:round}
#hero .f-spark path{fill:#ffe08a;stroke:#d9a93a;stroke-width:.6;animation:floatUp 2.4s ease-in infinite}
#hero .f-spark path:nth-child(2){animation-delay:-.8s}#hero .f-spark path:nth-child(3){animation-delay:-1.6s}
#hero .f-spark path:nth-child(4){animation-delay:-.4s}#hero .f-spark path:nth-child(5){animation-delay:-1.2s}
#hero .f-note text{fill:#4a4f8a;font-size:18px;animation:floatUp 2s ease-in infinite}
#hero .f-note text:nth-child(2){animation-delay:-.7s}#hero .f-note text:nth-child(3){animation-delay:-1.4s}
#hero .f-sprout path{fill:#5f9e3a;transform-box:fill-box;transform-origin:50% 100%;animation:grow 2.6s ease-out infinite}
#hero .f-sprout path:nth-child(2){animation-delay:-.9s}#hero .f-sprout path:nth-child(3){animation-delay:-1.7s}
#hero .f-ripple ellipse{fill:none;stroke:#fff;stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:ripple 2s ease-out infinite}
#hero .f-ripple ellipse:nth-child(2){animation-delay:-1s}
#hero .f-leaf ellipse{fill:#7fbf6a;animation:drift 3s linear infinite}
#hero .f-leaf ellipse:nth-child(2){animation-delay:-1s;fill:#a7d48f}#hero .f-leaf ellipse:nth-child(3){animation-delay:-2s}
.boat{animation:bob 1.6s ease-in-out infinite alternate}
.twinkle{animation:tw 2.8s ease-in-out infinite}
@keyframes hop{from{transform:translateY(0)}to{transform:translateY(-4px)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
@keyframes floatB{from{transform:translateY(-2px)}to{transform:translateY(-10px)}}
@keyframes tiltS{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
@keyframes tiltL{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
@keyframes tool{from{transform:rotate(-55deg)}to{transform:rotate(25deg)}}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-60px)}}
@keyframes floatUp{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
@keyframes grow{0%{transform:scale(0)}40%,80%{transform:scale(1)}100%{transform:scale(1);opacity:0}}
@keyframes ripple{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.6);opacity:0}}
@keyframes drift{0%{transform:translate(-90px,-70px) rotate(0);opacity:0}15%{opacity:1}100%{transform:translate(90px,-20px) rotate(200deg);opacity:0}}
@keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:8px 16px;border-radius:999px;font-size:.85rem;opacity:0;transition:opacity .3s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="toprow">
      <h1>ネーニア年代記<small id="lifeNo">第1の人生</small></h1>
      <div class="purse">
        <div class="gold"><b class="num" id="gold">0</b><span>金貨</span></div>
        <div class="star"><b class="num" id="mem">0</b><span>記憶のかけら</span></div>
        <div class="drop" id="dropBox" hidden><b class="num" id="drop">0</b><span>星のしずく</span></div>
      </div>
    </div>
    <div class="stage">
      <span class="chip" id="stName">村</span>
      <div class="sgauge"><i id="stFill"></i></div>
      <span class="snext num" id="stNext"></span>
    </div>
    <div class="ribbon" id="ribbon"><div class="track"><div class="fill" id="rfill"></div></div><div class="me" id="rme">14歳</div></div>
    <div class="agebar">
      <div>いま <b class="num" id="age">14</b>歳 ・ 寿命 <b class="num" id="life">50</b>歳</div>
      <div id="title">肩書き：村の子</div>
    </div>
    <div class="toggles">
      <button class="tg" id="tgAuto" aria-pressed="true">おまかせ行動</button>
      <button class="tg" id="tgShop" aria-pressed="true">おかいもの自動</button>
      <button class="tg" id="tgReb" aria-pressed="true">うまれかわり自動</button>
      <button class="tg" id="tgUp" aria-pressed="true">転生の泉 自動</button>
      <button class="tg" id="tgStar" aria-pressed="true">星還り 自動</button>
      <button class="tg" id="tgSpeed" aria-pressed="false">はやおくり ×2</button>
    </div>
  </header>

  <div class="scene" id="scene" aria-hidden="true">
    <svg viewBox="0 0 960 180" preserveAspectRatio="xMidYMax slice">
      <defs>
        <linearGradient id="sky0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe3f5"/><stop offset="1" stop-color="#eef7e6"/></linearGradient>
        <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fd2ef"/><stop offset="1" stop-color="#e8f5fb"/></linearGradient>
        <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3cdbd"/><stop offset="1" stop-color="#fbf0e3"/></linearGradient>
        <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fc0ee"/><stop offset="1" stop-color="#e3f2fc"/></linearGradient>
        <linearGradient id="sky4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121736"/><stop offset="1" stop-color="#3d306f"/></linearGradient>
        <radialGradient id="glowG"><stop offset="0" stop-color="#fff6c8" stop-opacity=".85"/><stop offset="1" stop-color="#fff6c8" stop-opacity="0"/></radialGradient>
      </defs>
      <rect id="skyRect" width="960" height="180" fill="url(#sky0)"/>
      <g id="sc0">
        <ellipse cx="170" cy="168" rx="270" ry="56" fill="#a6cb84"/><ellipse cx="780" cy="172" rx="300" ry="58" fill="#94bf72"/>
        <rect x="285" y="104" width="8" height="40" fill="#7a5233"/><circle cx="289" cy="98" r="24" fill="#6f9e4f"/>
        <rect x="640" y="104" width="50" height="40" fill="#efdcb8" stroke="#8a6a4a"/><polygon points="632,106 665,80 698,106" fill="#b5523b"/>
        <rect x="659" y="120" width="12" height="24" fill="#8a5a3a"/>
        <path d="M360 140 h120 M360 132 h120 M366 128 v16 M396 128 v16 M426 128 v16 M456 128 v16" stroke="#a07a52" stroke-width="3"/>
        <rect y="148" width="960" height="32" fill="#7fae5c"/>
      </g>
      <g id="sc1" style="display:none">
        <rect y="112" width="960" height="40" fill="#5aa3cf"/>
        <path d="M0 122 q20 -6 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0" stroke="#d8eef8" stroke-width="2" fill="none"/>
        <g class="boat"><path d="M180 116 h70 l-12 14 h-46 z" fill="#8a5a3a"/><path d="M214 114 v-44 l26 38 z" fill="#fbf6ea" stroke="#bba"/></g>
        <rect x="770" y="52" width="18" height="64" fill="#f6f6f2"/><rect x="770" y="68" width="18" height="10" fill="#c9503c"/><rect x="770" y="92" width="18" height="10" fill="#c9503c"/>
        <polygon points="766,54 779,40 792,54" fill="#c9503c"/><circle cx="779" cy="48" r="3" fill="#ffe08a"/>
        <rect y="148" width="960" height="32" fill="#b89068"/><path d="M0 156 H960 M0 166 H960" stroke="#9c7552" stroke-width="2"/>
      </g>
      <g id="sc2" style="display:none">
        <g fill="#d8c7b8" stroke="#a89382">
          <rect x="620" y="70" width="180" height="78"/><rect x="600" y="44" width="34" height="104"/><rect x="786" y="44" width="34" height="104"/><rect x="690" y="30" width="40" height="118"/>
        </g>
        <polygon points="596,46 617,18 638,46" fill="#a24e6a"/><polygon points="782,46 803,18 824,46" fill="#a24e6a"/><polygon points="686,32 710,0 734,32" fill="#a24e6a"/>
        <rect x="696" y="110" width="28" height="38" rx="14" fill="#7a5a4a"/>
        <path d="M710 0 v-6 l14 4 l-14 4" fill="#f2c14e" stroke="#a8760f"/>
        <g fill="#e9b7c6"><circle cx="120" cy="120" r="18"/><circle cx="150" cy="112" r="22"/><circle cx="180" cy="122" r="16"/></g>
        <rect y="148" width="960" height="32" fill="#c8bdb2"/><path d="M0 158 H960" stroke="#b0a396" stroke-width="2" stroke-dasharray="18 6"/>
      </g>
      <g id="sc3" style="display:none">
        <g fill="#fff" opacity=".9"><ellipse cx="120" cy="60" rx="50" ry="14"/><ellipse cx="820" cy="40" rx="60" ry="16"/><ellipse cx="560" cy="80" rx="30" ry="9"/></g>
        <g class="boat"><path d="M720 96 h60 l-14 22 h-32 z" fill="#7a9a5a"/><path d="M730 118 l20 14 l16 -14" fill="#8a7a6a"/></g>
        <path d="M0 150 Q80 132 160 150 T320 150 T480 150 T640 150 T800 150 T960 150 V180 H0 Z" fill="#ffffff"/>
        <rect y="156" width="960" height="24" fill="#eef5fa"/>
      </g>

 {k:'armor', n:'革のよろい',     c:9000,  d:'冒険の上達 ×1.5'},
 {k:'orb',   n:'水晶玉',         c:30000, d:'魔法の上達 ×2'},
 {k:'house', n:'小さな家',       c:80000, d:'すべての上達 ×1.5'},
 {k:'castle',n:'お城',           c:2e6,   d:'王の政務の稼ぎ ×2'},
];
const UPS=[
 {k:'life',  n:'長寿の泉',     d:'寿命 +5歳',              cost:l=>2+l*3},
 {k:'exp',   n:'早熟の才',     d:'すべての上達 +25%',      cost:l=>4+l*4},
 {k:'inh',   n:'ひいおばあの遺産', d:'生まれた時の金貨が増える', cost:l=>3+l*3},
 {k:'slow',  n:'時の砂時計',   d:'年をとるのが10%ゆっくり（最大5）', cost:l=>8+l*6, max:5},
];
const EVENTS=[
 ['村祭りでおだんごをもらった',0],['道で金貨を拾った',1],['猫に懐かれた',0],['星がとてもきれいな夜だった',0],
 ['旅の吟遊詩人から歌を教わった',0],['畑で大きなかぶが採れた',1],['雨宿りした小屋で昼寝した',0],['友だちと川で魚を釣った',0],
 ['古い宝箱を見つけた',3],['風邪をひいて一日寝ていた',0],['となり村のパン屋さんと仲良くなった',0],['流れ星にお願いをした',0],
];
const TITLES=[[0,'村の子'],[40,'働き者'],[100,'旅人'],[180,'町の名士'],[280,'英雄'],[400,'賢王'],[560,'伝説の人']];

function freshLife(meta){
  const lv={},exp={}; ACTS.forEach(a=>{lv[a.k]=0;exp[a.k]=0});
  return {gold:meta?Math.floor(100*(Math.pow(3,meta.up.inh)-1)/2):0, age:START_AGE, act:'farm', lv, exp, items:{}, seen:{farm:1}, log:[]};
}
let S;
function newGame(){
  const meta={star:0,starTotal:0,starNo:0,sup:{},mem:0,talent:{},up:{life:0,exp:0,inh:0,slow:0},lives:[],lifeNo:1};
  ACTS.forEach(a=>meta.talent[a.k]=0);
  S={meta,life:freshLife(null),auto:true,autoShop:true,autoReb:true,autoUp:true,autoStar:true,speed:1,dead:false,savedAt:Date.now()};
  addLog('この世に生まれ落ちた。まずは畑を手伝おう',true);
}
function load(){
  try{const raw=localStorage.getItem(SAVE); if(raw){S=JSON.parse(raw); return true}}catch(e){}
  return false;
}
function save(){S.savedAt=Date.now(); try{localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){}}

const lifespan=()=>50+S.meta.up.life*5+S.life.lv.pray*0.25;
const ageRate=()=>(1-0.1*S.meta.up.slow)/YEAR_SEC/(1+0.01*(S.life.lv.wind||0));
const req=lv=>Math.floor(40*Math.pow(1.13,lv));
const has=k=>!!S.life.items[k];
function expMult(k){
  const L=S.life.lv;
  let m=(1+0.04*S.meta.talent[k])*(1+0.25*S.meta.up.exp)*(1+0.012*L.book*(L.magic>0?1+L.magic*0.04:1));
  if(has('bed'))m*=1.2; if(has('house'))m*=1.5;
  if(k==='sword'&&has('woodsw'))m*=1.5; if(k==='book'&&has('candle'))m*=1.5;
  if(k==='adv'){m*=1+0.02*L.sword; if(has('armor'))m*=1.5}
  if(k==='magic'&&has('orb'))m*=2;
  m*=1+0.01*(L.music||0); m*=stExp()*starMult()*Math.pow(1.5,sup('bless'));
  return m;
}
function goldRate(k){
  const a=ACTS.find(x=>x.k===k); let g=a.g*(1+0.15*S.life.lv[k]);
  if(k==='farm'&&has('hat'))g*=2; if(k==='trade'&&has('cart'))g*=2; if(k==='king'&&has('castle'))g*=2;
  return g*stGold()*starMult()*Math.pow(2,sup('gold'));
}
const unlocked=a=>stage()>=(a.st||0)&&a.u(S.life.lv);
const totalLv=()=>Object.values(S.life.lv).reduce((a,b)=>a+b,0);
function title(){let t=TITLES[0][1]; TITLES.forEach(([n,x])=>{if(totalLv()>=n)t=x}); return t}

function addLog(text,big){S.life.log.unshift({a:Math.floor(S.life.age),t:text,b:!!big}); if(S.life.log.length>80)S.life.log.pop()}

let autoT=0;
function step(dt){
  if(S.dead){if(S.autoReb){S.rebT=(S.rebT??3)-dt; if(S.rebT<=0)rebirth()} return}
  const L=S.life, prevYear=Math.floor(L.age);
  L.age+=dt*ageRate();
  let a=ACTS.find(x=>x.k===L.act); if(!a||!unlocked(a)){a=ACTS[0];L.act='farm'}
  L.exp[a.k]+=20*expMult(a.k)*dt;
  while(L.exp[a.k]>=req(L.lv[a.k])){
    L.exp[a.k]-=req(L.lv[a.k]); L.lv[a.k]++;
    if(L.lv[a.k]%10===0)addLog(`${a.n}が Lv${L.lv[a.k]} になった`);
  }
  L.gold+=goldRate(a.k)*dt;
  ACTS.forEach(x=>{if(!L.seen[x.k]&&unlocked(x)){L.seen[x.k]=1;addLog(`「${x.n}」ができるようになった！`,true);toast(`「${x.n}」が解放されました`)}});
  if(Math.floor(L.age)>prevYear&&Math.random()<0.3){
    const pool=EVENTS.concat(STAGE_EV[stage()]||[]); const e=pool[Math.floor(Math.random()*pool.length)];
    if(e[1]){const g=Math.ceil((goldRate(L.act)+1)*YEAR_SEC*e[1]);L.gold+=g;addLog(`${e[0]}（金貨+${fmt(g)}）`)}else addLog(e[0]);
  }
  autoT+=dt;
  if(autoT>=1){autoT=0; if(S.auto)autoPick(); if(S.autoShop)autoBuy(); if(S.autoUp)autoUpgrade()}
  if(L.age>=lifespan())die();
}
function autoPick(){
  const L=S.life, open=ACTS.filter(unlocked);
  // gold-poor? keep earning. Otherwise raise the lowest-level thing, favouring newer ones.
  const nextItem=ITEMS.find(i=>!L.items[i.k]);
  let best=null,score=1e9;
  open.forEach((a,i)=>{
    let s=L.lv[a.k]-i*1.5-S.meta.talent[a.k]*0.3;
    if(nextItem&&L.gold<nextItem.c*0.2&&a.g>0)s-=6;
    if(s<score){score=s;best=a}
  });
  if(best)L.act=best.k;
}
function autoUpgrade(){
  let bought=false;
  for(;;){
    let best=null,bc=Infinity;
    UPS.forEach(u=>{const l=S.meta.up[u.k]; if(u.max&&l>=u.max)return; const c=u.cost(l); if(c<bc){bc=c;best=u}});
    if(!best||S.meta.mem<bc)break;
    S.meta.mem-=bc; S.meta.up[best.k]++; bought=true;
  }
  for(;;){
    let best=null,bc=Infinity;
    SUPS.forEach(u=>{const l=sup(u.k); if(u.max&&l>=u.max)return; const c=u.cost(l); if(c<bc){bc=c;best=u}});
    if(!best||(S.meta.star||0)<bc)break;
    S.meta.star-=bc; S.meta.sup[best.k]=sup(best.k)+1; bought=true;
  }
  if(bought&&(curTab==='reb'||curTab==='starr'))renderPane();
}
function autoBuy(){ITEMS.forEach(i=>{if(!S.life.items[i.k]&&S.life.gold>=i.c){S.life.gold-=i.c;S.life.items[i.k]=1;addLog(`${i.n}を買った`)}})}

function die(){
  const L=S.life, M=S.meta;
  const gain=Math.max(1,Math.floor((totalLv()/12+L.age/15+(L.lv.king>0?5:0))*(1+0.02*(L.lv.starread||0))*Math.pow(1.5,sup('memo'))));
  ACTS.forEach(a=>{M.talent[a.k]=Math.max(M.talent[a.k],L.lv[a.k])});
  M.mem+=gain; M.memTotal=(M.memTotal||0)+gain;
  const st0=stage(); advanceStage();
  S.stageUp=stage()>st0?STAGES[stage()].n:null;
  if(S.stageUp)toast(`${S.stageUp}にたどり着いた！`);
  if(S.autoUp)autoUpgrade();
  const bestA=ACTS.reduce((b,a)=>L.lv[a.k]>L.lv[b.k]?a:b,ACTS[0]);
  M.lives.unshift({st:st0,no:M.lifeNo,age:Math.floor(L.age),title:title(),best:`${bestA.n} Lv${L.lv[bestA.k]}`,gain});
  if(M.lives.length>30)M.lives.pop();
  addLog(`${Math.floor(L.age)}歳で静かに生涯を終えた`,true);
  S.dead=true; S.lastGain=gain; S.rebT=S.stageUp?6:3; save(); showDeath(); renderPane();
}
function rebirth(){
  if(wantAutoStar()){starReturn();return}
  S.meta.lifeNo++; S.life=freshLife(S.meta); S.dead=false;
  if(S.stageUp){addLog(`${STAGES[stage()].hi}で、第${S.meta.lifeNo}の人生がはじまった`,true)}
  else addLog(`第${S.meta.lifeNo}の人生がはじまった。前世の記憶がうっすら残っている`,true);
  S.stageUp=null;
  $('veil').hidden=true; renderPane(); save();
}

function starReturn(){
  const M=S.meta, g=starGain(); if(g<=0)return;
  M.star=(M.star||0)+g; M.starTotal=(M.starTotal||0)+g; M.starNo=(M.starNo||0)+1;
  M.mem=0; M.memTotal=0; M.stage=0; UPS.forEach(u=>M.up[u.k]=0); ACTS.forEach(a=>M.talent[a.k]=0);
  M.lifeNo++; M.lives.unshift({st:0,no:M.lifeNo-1,age:0,title:'星還り',best:`${M.starNo}回目の星還り`,gain:0});
  S.life=freshLife(M); S.dead=false; S.stageUp=null; applyStage();
  if(S.autoUp)autoUpgrade();
  addLog(`星に還り、しずくを${g}つ授かった。もう一度、村から歩きはじめる`,true);
  S.starCard=g; showStarCard(); renderPane(); save();
}
function showStarCard(){
  $('dcard').innerHTML=`<p class="arrive" style="color:#6a5fc4">星還り</p><h2>星のしずく +${S.starCard}</h2>
   <p>記憶のかけらも才能も星に還しました。そのかわり、しずくの光がずっと背中を押してくれます。</p>
   <p class="gain num">稼ぎと上達 ×${starMult().toFixed(1)}</p>
   <button class="big-btn" id="starOk">村からはじめる</button>`;
  $('veil').hidden=false;
  const close=()=>{S.starCard=0;$('veil').hidden=true};
  $('starOk').addEventListener('click',close);
  if(S.autoReb)setTimeout(()=>{if(S.starCard)close()},5000);
}
function advanceStage(){
  const M=S.meta; M.stage=M.stage||0;
  while(M.stage<STAGES.length-1&&(M.memTotal||0)>=thr(M.stage+1))M.stage++;
  applyStage();
}
function applyStage(){try{document.documentElement.style.setProperty('--stage',STAGES[stage()].c)}catch(e){}}
let sceneKey='', lastLog=null, bubT=0;
function updateScene(){
  const L=S.life, st=stage(), hero=$('hero');
  const key=L.act+'|'+st;
  if(key!==sceneKey){
    sceneKey=key;
    const lk=LOOK[L.act]||LOOK.farm;
    hero.setAttribute('class',`pose-${lk[0]} prop-${lk[1]||'none'} fx-${lk[2]||'none'}${L.act==='king'||L.act==='starking'?' crowned':''}`);
    STAGES.forEach((_,i)=>{$('sc'+i).style.display=i===st?'':'none'});
    $('skyRect').setAttribute('fill',`url(#sky${st})`);
  }
  hero.classList.toggle('gone',!!S.dead);
  const grow=Math.min(1,0.84+(L.age-START_AGE)*0.03);
  $('heroIn').setAttribute('transform',`scale(${grow.toFixed(3)})`);
  const top=L.log[0];
  if(top&&top!==lastLog){lastLog=top; const b=$('bubble'); b.textContent=top.t.length>30?top.t.slice(0,29)+'…':top.t; b.hidden=false; bubT=Date.now()}
  if(!$('bubble').hidden&&Date.now()-bubT>3800)$('bubble').hidden=true;
}
function makeStars(){
  const g=$('stars'); let h='';
  for(let i=0;i<70;i++){const x=(i*137.5)%960, y=(i*53.7)%130, r=(i%5===0)?1.8:1;
    h+=`<circle class="${i%3?'':'twinkle'}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="#fff" style="animation-delay:${-(i%7)*.4}s"/>`}
  g.innerHTML=h;
}
/* ---------- view ---------- */
const $=id=>document.getElementById(id);
function fmt(n){n=Math.floor(n); if(n<1e4)return n.toLocaleString('ja-JP'); if(n<1e8)return (n/1e4).toFixed(n<1e5?1:0)+'万'; if(n<1e12)return (n/1e8).toFixed(1)+'億'; return (n/1e12).toFixed(1)+'兆'}

const actEls={};
function buildActs(){
  const box=$('acts'); box.innerHTML='';
  ACTS.forEach(a=>{
    const b=document.createElement('button'); b.className='act'; b.id='act-'+a.k;
    b.innerHTML=`<span class="seal">${a.s}</span><span class="nm">${a.n}<em></em></span><span class="lv num">Lv <b>0</b></span><span class="bar"><i></i></span><span class="lock" hidden></span>`;
    b.addEventListener('click',()=>{if(S.dead||!unlocked(a))return; S.life.act=a.k; if(S.auto){S.auto=false;syncToggles();toast('自分で選んだので、おまかせ行動をオフにしました')} render()});
    box.appendChild(b); actEls[a.k]={b,em:b.querySelector('em'),lv:b.querySelector('.lv b'),bar:b.querySelector('.bar i'),barW:b.querySelector('.bar'),lock:b.querySelector('.lock')};
  });
}
function buildRibbon(){
  const r=$('ribbon'); r.querySelectorAll('.tick').forEach(t=>t.remove());
  const span=lifespan()-START_AGE;
  for(let y=20;y<lifespan();y+=10){const t=document.createElement('span');t.className='tick num';t.style.left=((y-START_AGE)/span*100)+'%';t.textContent=y;r.appendChild(t)}
}
let ribbonLife=0;
function render(){
  const L=S.life, M=S.meta;
  $('gold').textContent=fmt(L.gold); $('mem').textContent=fmt(M.mem);
  $('dropBox').hidden=!(M.starTotal||stage()>=2); $('drop').textContent=fmt(M.star||0);
  $('lifeNo').textContent=`第${M.lifeNo}の人生`;
  const ls=lifespan(); if(Math.floor(ls)!==ribbonLife){ribbonLife=Math.floor(ls);buildRibbon()}
  const p=Math.min(1,(L.age-START_AGE)/(ls-START_AGE));
  $('rfill').style.width=(p*100)+'%'; $('rme').style.left=Math.min(96,Math.max(4,p*100))+'%'; $('rme').textContent=Math.floor(L.age)+'歳';
  $('age').textContent=Math.floor(L.age); $('life').textContent=Math.floor(ls);
  $('title').textContent='肩書き：'+title();
  const st=stage(), nx=STAGES[st+1], cur=STAGES[st], tot=M.memTotal||0;
  $('stName').textContent=cur.n;
  const bonus=st?`稼ぎ ×${fmt(stGold())}・上達 ×${stExp().toFixed(1)} ／ `:'';
  if(nx){$('stFill').style.width=Math.min(100,(tot-thr(st))/(thr(st+1)-thr(st))*100)+'%'; $('stNext').textContent=`${bonus}次の舞台「${nx.n}」まで 記憶のかけら ${fmt(tot)} / ${fmt(thr(st+1))}`}
  else{$('stFill').style.width='100%'; $('stNext').textContent=`${bonus}最後の舞台にたどり着きました`}
  ACTS.forEach(a=>{
    const e=actEls[a.k], ok=unlocked(a);
    const far=(a.st||0)>st+1; e.b.hidden=far; if(far)return;
    e.b.disabled=!ok; e.b.classList.toggle('on',L.act===a.k&&!S.dead);
    e.lv.textContent=L.lv[a.k];
    e.lock.hidden=ok; e.barW.hidden=!ok;
    if(!ok){e.lock.textContent=(a.st||0)>st?`「${STAGES[a.st].n}」に着くと解放`:'解放条件：'+a.uh; e.em.textContent=''}
    else{
      e.bar.style.width=(L.exp[a.k]/req(L.lv[a.k])*100)+'%';
      const tal=M.talent[a.k]?` ・才能${M.talent[a.k]}`:'';
      e.em.textContent=(a.g?`金貨 +${fmt(goldRate(a.k))}/秒`:a.d)+tal;
    }
  });
  if(curTab==='shop'||curTab==='reb'||curTab==='starr')refreshButtons();
  updateScene();
}

let curTab='shop';
function renderPane(){
  const p=$('pane'); p.innerHTML='';
  if(curTab==='shop'){
    p.insertAdjacentHTML('beforeend','<p class="note">この人生のあいだ効き目がつづく道具です。生まれ変わると無くなります。</p>');
    ITEMS.forEach(i=>p.insertAdjacentHTML('beforeend',`<div class="item" data-i="${i.k}"><span class="t">${i.n}</span><span class="d">${i.d}</span><button>金貨 ${fmt(i.c)}</button></div>`));
    p.querySelectorAll('.item').forEach(el=>el.querySelector('button').addEventListener('click',()=>{
      const i=ITEMS.find(x=>x.k===el.dataset.i); if(S.life.items[i.k]||S.life.gold<i.c)return;
      S.life.gold-=i.c; S.life.items[i.k]=1; addLog(`${i.n}を買った`); render();
    }));
  }else if(curTab==='reb'){
    p.insertAdjacentHTML('beforeend','<p class="note">人生を終えるたびに「記憶のかけら」がたまります。ここで使うと、次の人生からずっと効きます。上達した技は「才能」として残り、次の人生で伸びやすくなります。</p>');
    UPS.forEach(u=>p.insertAdjacentHTML('beforeend',`<div class="item star-up" data-u="${u.k}"><span class="t">${u.n} <span class="num" style="color:var(--muted);font-weight:500">Lv${S.meta.up[u.k]}</span></span><span class="d">${u.d}</span><button></button></div>`));
    p.querySelectorAll('.item').forEach(el=>el.querySelector('button').addEventListener('click',()=>{
      const u=UPS.find(x=>x.k===el.dataset.u), l=S.meta.up[u.k], c=u.cost(l);
      if((u.max&&l>=u.max)||S.meta.mem<c)return;
      S.meta.mem-=c; S.meta.up[u.k]++; renderPane(); render(); save();
    }));
  }else if(curTab==='log'){
    const ul=document.createElement('ul'); ul.className='log';
    S.life.log.forEach(l=>ul.insertAdjacentHTML('beforeend',`<li class="${l.b?'big':''}"><span class="num">${l.a}歳</span>${l.t}</li>`));
    p.appendChild(ul);
  }else if(curTab==='starr'){
    const M=S.meta, g=starGain(), ok=stage()>=2;
    p.insertAdjacentHTML('beforeend',`<p class="note">星還りをすると、記憶のかけら・転生の泉の強化・才能・舞台がぜんぶリセットされて、村からやり直しになります。そのかわり「星のしずく」がもらえます。しずくは手に入れた数だけ、稼ぎと上達がずっと +10% になり、星の祭壇で強化にも使えます。「星還り 自動」がオンなら、もらえるしずくがこれまでの合計以上（最低2）になったときに自動で還ります。</p>
     <div class="item" style="background:color-mix(in srgb,var(--bg) 80%,#6a5fc4)"><span class="t">${ok?`いま還ると しずく +${g}`:'「王都」にたどり着くと星還りできます'}</span>
      <span class="d">これまでのしずく ${fmt(M.starTotal||0)}（稼ぎ・上達 ×${starMult().toFixed(1)}）・星還り ${M.starNo||0}回</span>
      <button id="starGo" ${ok&&g>0?'':'disabled'}>星に還る</button></div>
     <p class="note" style="margin-top:6px">星の祭壇（しずくで強化）</p>`);
    SUPS.forEach(u=>p.insertAdjacentHTML('beforeend',`<div class="item star-up" data-s="${u.k}"><span class="t">${u.n} <span class="num" style="color:var(--muted);font-weight:500">Lv${sup(u.k)}</span></span><span class="d">${u.d}</span><button></button></div>`));
    let armed=0;
    $('starGo').addEventListener('click',e=>{
      if(Date.now()-armed>4000){armed=Date.now();e.target.textContent='もう一度押すと還ります';setTimeout(()=>{if(e.target.isConnected)e.target.textContent='星に還る'},4000);return}
      starReturn();
    });
    p.querySelectorAll('.item[data-s]').forEach(el=>el.querySelector('button').addEventListener('click',()=>{
      const u=SUPS.find(x=>x.k===el.dataset.s), l=sup(u.k), c=u.cost(l);
      if((u.max&&l>=u.max)||(S.meta.star||0)<c)return;
      S.meta.star-=c; S.meta.sup[u.k]=l+1; renderPane(); render(); save();
    }));
  }else if(curTab==='save'){
    p.insertAdjacentHTML('beforeend',`<p class="note">データはこのブラウザに自動で保存されています。ページを閉じていても、最大12時間ぶんは次に開いたときにまとめて進みます。別の端末やブラウザに移すとき、念のための控えを取るときは「セーブコード」を使ってください。</p>
     <div class="savebox">
      <button class="big-btn" id="svCopy">セーブコードをコピー</button>
      <textarea id="svCode" rows="4" placeholder="ここにセーブコードを貼りつけて「読み込む」を押す"></textarea>
      <div class="row"><button class="tg" id="svLoad">読み込む</button><button class="tg danger" id="svReset">最初からやり直す</button></div>
     </div>`);
    const ta=$('svCode');
    $('svCopy').addEventListener('click',()=>{
      save(); const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
      const fallback=()=>{ta.value=code;ta.focus();ta.select();toast('下の欄のコードを選んでコピーしてください')};
      try{navigator.clipboard.writeText(code).then(()=>toast('セーブコードをコピーしました'),fallback)}catch(e){fallback()}
    });
    $('svLoad').addEventListener('click',()=>{
      try{
        const d=JSON.parse(decodeURIComponent(escape(atob(ta.value.trim()))));
        if(!d||!d.meta||!d.life)throw 0;
        S=d; ribbonLife=0; save(); ta.value='';
        $('veil').hidden=true; if(S.dead)showDeath();
        syncToggles(); render(); toast('セーブコードを読み込みました');
      }catch(e){toast('読み込めませんでした。コードを最後まで貼りつけたか確認してください')}
    });
    let armed=0;
    $('svReset').addEventListener('click',e=>{
      if(Date.now()-armed>4000){armed=Date.now();e.target.textContent='本当に？もう一度押すと消えます';setTimeout(()=>{e.target.textContent='最初からやり直す'},4000);return}
      newGame(); ribbonLife=0; save(); $('veil').hidden=true; syncToggles(); renderPane(); render(); toast('最初からはじめました');
    });
  }else{
    if(!S.meta.lives.length)p.insertAdjacentHTML('beforeend','<p class="note">まだ最初の人生の途中です。寿命をむかえると、ここに記録が残ります。</p>');
    S.meta.lives.forEach(v=>p.insertAdjacentHTML('beforeend',`<div class="past"><b>第${v.no}</b><span>${STAGES[v.st||0].n}・${v.title}・${v.best}</span><span class="num">${v.age}歳 ／ +${v.gain}</span></div>`));
  }
  refreshButtons();
}
function refreshButtons(){
  $('pane').querySelectorAll('.item[data-i]').forEach(el=>{
    const i=ITEMS.find(x=>x.k===el.dataset.i), b=el.querySelector('button'), own=!!S.life.items[i.k];
    el.classList.toggle('owned',own); b.disabled=own||S.life.gold<i.c||S.dead; b.textContent=own?'持っている':'金貨 '+fmt(i.c);
  });
  $('pane').querySelectorAll('.item[data-s]').forEach(el=>{
    const u=SUPS.find(x=>x.k===el.dataset.s), l=sup(u.k), b=el.querySelector('button'), mx=u.max&&l>=u.max;
    b.disabled=mx||(S.meta.star||0)<u.cost(l); b.textContent=mx?'最大':'しずく '+u.cost(l);
  });
  $('pane').querySelectorAll('.item[data-u]').forEach(el=>{
    const u=UPS.find(x=>x.k===el.dataset.u), l=S.meta.up[u.k], b=el.querySelector('button'), mx=u.max&&l>=u.max;
    b.disabled=mx||S.meta.mem<u.cost(l); b.textContent=mx?'最大':'かけら '+u.cost(l);
  });
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  curTab=t.dataset.t; document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===t)); renderPane();
}));

function showDeath(){
  const v=S.meta.lives[0];
  $('dcard').innerHTML=`${S.stageUp?`<p class="arrive">${S.stageUp}にたどり着いた！</p><p>${STAGES[stage()].hi}。次の人生はここから始まります。</p>`:''}<h2>第${v.no}の人生、おしまい</h2>
   <p>${v.age}歳まで生きて「${v.title}」と呼ばれました。<br>いちばん得意だったのは ${v.best}。</p>
   <p class="gain num">記憶のかけら +${v.gain}</p>
   <p>覚えた技は才能として次の人生に残ります。</p>${S.autoReb?'<p>まもなく自動で生まれ変わります</p>':''}
   <button class="big-btn" id="reborn">生まれ変わる</button>`;
  $('veil').hidden=false; $('reborn').addEventListener('click',rebirth); $('reborn').focus();
}

function syncToggles(){$('tgAuto').setAttribute('aria-pressed',S.auto);$('tgShop').setAttribute('aria-pressed',S.autoShop);$('tgReb').setAttribute('aria-pressed',S.autoReb);$('tgUp').setAttribute('aria-pressed',S.autoUp);$('tgStar').setAttribute('aria-pressed',S.autoStar);$('tgSpeed').setAttribute('aria-pressed',S.speed>1)}
$('tgAuto').addEventListener('click',()=>{S.auto=!S.auto;syncToggles()});
$('tgShop').addEventListener('click',()=>{S.autoShop=!S.autoShop;syncToggles()});
$('tgReb').addEventListener('click',()=>{S.autoReb=!S.autoReb;S.rebT=3;syncToggles();if(S.dead)showDeath()});
$('tgUp').addEventListener('click',()=>{S.autoUp=!S.autoUp;syncToggles();if(S.autoUp)autoUpgrade()});
$('tgStar').addEventListener('click',()=>{S.autoStar=!S.autoStar;syncToggles()});
$('tgSpeed').addEventListener('click',()=>{S.speed=S.speed>1?1:2;syncToggles()});

let tt;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600)}

/* ---------- boot ---------- */
function start(hotData){
  let loaded=false;
  if(hotData&&hotData.S)S=hotData.S;
  else if(load())loaded=true;
  else newGame();
  if(S.autoReb===undefined)S.autoReb=true;
  if(S.autoUp===undefined)S.autoUp=true;
  if(S.autoStar===undefined)S.autoStar=true;
  S.meta.sup=S.meta.sup||{}; S.meta.star=S.meta.star||0; S.meta.starTotal=S.meta.starTotal||0;
  {const M=S.meta; M.stage=M.stage||0;
   if(M.memTotal===undefined){let spent=0; UPS.forEach(u=>{for(let l=0;l<(M.up[u.k]||0);l++)spent+=u.cost(l)}); M.memTotal=M.mem+spent}
   ACTS.forEach(a=>{if(S.life.lv[a.k]===undefined){S.life.lv[a.k]=0;S.life.exp[a.k]=0} if(M.talent[a.k]===undefined)M.talent[a.k]=0});
   advanceStage();}
  if(loaded){ // offline progress, up to 2 hours
    let away=Math.min(43200,(Date.now()-(S.savedAt||Date.now()))/1000);
    if(away>30&&!(S.dead&&!S.autoReb)){
      const g0=S.life.gold, n0=S.meta.lifeNo, st0=stage();
      while(away>0&&!(S.dead&&!S.autoReb)){step(Math.min(1,away));away-=1}
      const lives=S.meta.lifeNo-n0;
      setTimeout(()=>toast(stage()>st0?`留守のあいだに「${STAGES[stage()].n}」までたどり着きました`
        :lives>0?`留守のあいだに 人生が${lives}回めぐりました`
        :`留守のあいだに 金貨+${fmt(S.life.gold-g0)}`),600);
    }
  }
  makeStars(); lastLog=S.life.log[0]||null;
  buildActs(); syncToggles(); renderPane(); render();
  if(S.dead)showDeath();
  let last=performance.now(), acc=0, saveT=0;
  function loop(now){
    let dt=Math.min(0.5,(now-last)/1000); last=now;
    const was=S.dead;
    step(dt*S.speed);
    acc+=dt; saveT+=dt;
    if(acc>0.1){acc=0;render(); if(curTab==='log'&&S.life.log.length&&$('pane').querySelectorAll('li').length!==S.life.log.length)renderPane()}
    if(saveT>5){saveT=0;save()}
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  window.addEventListener('pagehide',save);
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>

</body>
